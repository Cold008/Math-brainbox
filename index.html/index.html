<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102a43" />
  <title>MathEase JSS3 — Learn, Practise, Succeed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">π</div>
        <div>
          <strong>MathEase</strong>
          <span>JSS3 Learning Hub</span>
        </div>
      </div>

      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon">⌂</span><span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="syllabus">
          <span class="nav-icon">▦</span><span>Syllabus</span>
        </button>
        <button class="nav-item" data-view="practice">
          <span class="nav-icon">✎</span><span>Practice</span>
        </button>
        <button class="nav-item" data-view="pastQuestions">
          <span class="nav-icon">◫</span><span>Past Questions</span>
        </button>
      </nav>

      <div class="sidebar-card">
        <div class="sidebar-card-icon">★</div>
        <div><strong>Keep going!</strong><span id="sidebarProgress">0 topics started</span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
        <div>
          <p class="eyebrow">MY CLASSROOM</p>
          <h1 id="pageTitle">Good morning, Scholar!</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">☾</button>
          <div class="avatar" aria-label="Student profile">JS</div>
        </div>
      </header>

      <div id="viewRoot"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
